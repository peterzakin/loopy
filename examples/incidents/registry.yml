# The canonical Loopy example — the incidents loop (README).
# Seeded in M1 (registry only); workflows/sensors grow through M2–M4, full by M5.

# Defaults — every agent inherits these; override a field only when needed.
defaults:
  agent:
    sandbox: default
    model: claude-sonnet-4-6
    harness: claude-code

# Sandbox — compute + egress. `image:` is the declarative build. Egress is open by default.
sandboxes:
  default:
    provider: daytona
    image: { debian_slim: "3.12", apt: [git], workdir: /home/daytona, user: daytona }
    env_file: secrets/base.env   # referenced, gitignored; resolved by the backend at run time
    repos: [acme/runbooks]          # cloned into the workspace at acquire time (auth injected)

# Agents — capability comes from the sandbox (image + egress), skills, injected creds, and
# budget; numeric caps live in budget, not in a tool name.
agents:
  Investigator: { skills: [triage, repro-authoring] }
  Fixer: { model: claude-opus-4-8, skills: [testing] }
  Reviewer: { skills: [rubrics/fix-quality] }
  Releaser: { skills: [rollout] }

# Events — the bus contract. A step's `on:` may only name an event registered here.
events:
  # published by sensors
  Incident:
    source: enum[sentry, linear, datadog, pagerduty, slack]
    issue_id: str
    title: str
    link: url
  MetricThreshold: { goal_id: str }
  # emitted by steps — cross-workflow seams + terminal announcements
  WorkItem:
    source: enum[sentry, linear, datadog, pagerduty, slack, cve]
    link: url
    root_cause: str
    proposed_goal: str
    repro: str
  GoalShipped: { goal_id: str }
