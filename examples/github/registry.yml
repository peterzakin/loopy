# github — react to GitHub events delivered to one webhook. Two clear loops:
#   • a PR is opened   → an agent reviews the diff and posts comments     (PullRequestOpened)
#   • a PR is merged   → an agent proposes the follow-on work it implies  (PullRequestMerged)
#
# Both sensors listen on the SAME URL (/hooks/github): GitHub posts every event type there,
# so the runner fans each delivery out to both sensors and only the matching one emits. See
# README for the GitHub App / webhook setup and how the signature is verified at the edge.

# Defaults — every agent inherits these; override a field only when needed.
defaults:
  agent:
    sandbox: Dev
    harness: { runtime: claude-code, model: claude-sonnet-4-6 }

# Sandbox — compute + egress. `gh` is on PATH so an agent can post review comments via the
# injected GitHub token; egress is limited to github.com + the model API.
sandboxes:
  Dev:
    provider: docker
    image: { debian_slim: "3.12", apt: [git, gh], workdir: /home/loopy, user: loopy }
    network: [github.com, api.anthropic.com]
    env_file: secrets/dev.env          # gitignored; resolved by the backend at run time
    repos: [octocat/Hello-World]       # cloned into the workspace at acquire time (auth injected)

# Agents — capability comes from the sandbox + the injected GitHub token + budget.
agents:
  Reviewer: {}   # reviews an opened PR
  Scout: {}      # mines a merged PR for follow-on work

# Events — the bus contract. A step's `on:` may only name an event registered here, and a
# sensor's `emits` must match one of these.
events:
  # ── inbound (published by the GitHub webhook sensors) ──
  PullRequestOpened:
    fields:
      number: int      # PR number
      repo: str        # owner/name
      title: str
      branch: str      # head ref (the PR's source branch)
      base: str        # base ref (what it merges into)
      url: url         # html_url of the PR
  PullRequestMerged:
    fields:
      number: int
      repo: str
      title: str
      url: url
      merged_by: str   # login of whoever merged it
  # ── outbound (emitted by the steps; available for a downstream workflow to subscribe to) ──
  ReviewPosted:
    fields:
      verdict: str
      comments_posted: int
  WorkProposed:
    fields:
      ideas: str
