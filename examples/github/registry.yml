# github — react to GitHub events with zero sensor boilerplate. Two clear loops:
#   • a PR is opened   → an agent reviews the diff and posts comments     (Github.PullRequestOpened)
#   • a PR is merged   → an agent proposes the follow-on work it implies  (Github.PullRequestMerged)
#
# The `Github.*` events are BUILT IN: a workflow triggers on them directly (see workflows/),
# and the compiler injects the event contract + a sensor on /hooks/github for you — no
# `events:` entry and no `sensors/` module to write. GitHub posts every event type to that one
# URL; the runner verifies the signature once at the edge and fans each delivery out to the
# built-in sensors, and only the matching one emits. See README for the App / webhook setup.

# Defaults — every agent inherits these; override a field only when needed.
defaults:
  agent:
    sandbox: BaseSandbox
    model: claude-sonnet-4-6
    harness: claude-code

# Sandbox — compute + egress. `gh` is on PATH so an agent can post review comments via the
# injected GitHub token; egress is limited to github.com + the model API.
sandboxes:
  BaseSandbox:
    provider: daytona
    image: { debian_slim: "3.12", apt: [git, gh], workdir: /home/loopy, user: loopy }
    network: [github.com, api.anthropic.com]
    env_file: secrets/base.env          # gitignored; resolved by the backend at run time
    repos: [octocat/Hello-World]       # cloned into the workspace at acquire time (auth injected)

# Agents — capability comes from the sandbox + the injected GitHub token + budget.
agents:
  Reviewer: {}   # reviews an opened PR
  Scout: {}      # mines a merged PR for follow-on work

# Events — only the OUTBOUND events the steps emit need declaring here. The inbound
# `Github.PullRequestOpened` / `Github.PullRequestMerged` triggers are built in (their
# contracts are registered automatically when a workflow triggers on them).
events:
  ReviewPosted:
    verdict: str
    comments_posted: int
  WorkProposed:
    ideas: str
