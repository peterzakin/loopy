# standup — a scheduled digest. Every weekday morning, one agent reads what merged in the
# repo since it last ran and writes a short standup digest. The smallest example of a
# TIME-DRIVEN loop: no sensor to write, no webhook to host, no repo to push to.
#
#   cron("0 9 * * 1-5")  ─▶  standup/digest  (Digester)  ─▶  DigestReady
#                            reads merged PRs since last run · writes the digest
#
# The entry step triggers on a built-in `cron(...)` schedule, so it needs no `events:` entry
# and no `sensors/` module. Each tick carries `{{ event.last_run }}` and
# `{{ event.scheduled_at }}`, so the agent digests exactly the window since the previous run.

# Defaults — every agent inherits these; override a field only when needed.
defaults:
  agent:
    sandbox: BaseSandbox
    model: claude-sonnet-4-6
    harness: claude-code

# Sandbox — compute + egress. `gh` is on PATH so the agent can read merged PRs via the
# injected GitHub token; egress is limited to github.com + the model API.
sandboxes:
  BaseSandbox:
    provider: daytona
    image: { debian_slim: "3.12", apt: [git, gh], workdir: /home/loopy, user: loopy }
    network: [github.com, api.anthropic.com]
    env_file: secrets/base.env          # gitignored; resolved by the backend at run time
    repos: [octocat/Hello-World]       # cloned into the workspace at acquire time (auth injected)

# Agents — capability comes from the sandbox + the injected GitHub token + budget.
agents:
  Digester: {}   # reads recent merges and writes the digest

# Events — only the OUTBOUND event the step emits needs declaring. The inbound trigger is a
# built-in `cron(...)` schedule, so it has no `events:` entry. A downstream workflow could
# subscribe to `DigestReady` to post it to Slack or email (out of scope here).
events:
  DigestReady:
    markdown: str
    pr_count: int
