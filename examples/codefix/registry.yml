# codefix — the smallest real loop: one CodeTask event → a claude-code agent that
# edits a checkout and opens a PR. The companion to README's "Run locally" quickstart
# and the path the `incidents` example doesn't exercise (a single repo-touching step you
# can drive end-to-end with `loopy trigger`).

# Defaults — every agent inherits these; override a field only when needed.
defaults:
  agent:
    sandbox: BaseSandbox
    model: claude-sonnet-4-6
    harness: claude-code

# Sandbox — compute + egress. `provider:` selects the backend (this is the source of truth;
# there is no `--sandbox` flag). `docker` is hermetic: the toolchain (git, the `claude` CLI on
# PATH, HOME) comes from the image, so a local run needs no host-env leak — the gap #6 fixed.
# Switch `provider:` to `local` (bare subprocess) for a no-Docker box, but then PATH/HOME/the
# model key must be supplied in the env_file (see README); or `daytona` for a cloud sandbox.
sandboxes:
  BaseSandbox:
    provider: docker
    image: { debian_slim: "3.12", apt: [git], workdir: /home/loopy, user: loopy }
    network: [github.com, api.anthropic.com]   # git over https + the model API
    env_file: secrets/base.env                  # gitignored; resolved by the backend at run time
    repos: [octocat/Hello-World]               # cloned into the workspace at acquire time (auth injected)

# Agents — capability comes from the sandbox (image + egress), skills, the injected GitHub
# token, and budget. One agent here: the coder that makes the edit and opens the PR.
agents:
  Coder: { skills: [codefix] }

# Events — the bus contract. A step's `on:` may only name an event registered here.
events:
  # the task to act on — published by a sensor in a real deployment, or fired by hand with
  # `loopy trigger --event CodeTask --fields '{...}'` (see README).
  CodeTask:
    task: str     # what to change, in prose
    branch: str   # the branch to push the edit on
  # emitted when the PR is open — a downstream workflow could subscribe to it (none here).
  PROpened:
    pr_url: url
    summary: str
