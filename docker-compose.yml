# Single-node Loopy deployment.
#
#   loopy   — one process: sensor webhooks + scheduler + event-bus consumer + runtime.
#   redis   — the event bus: decouples ingress from execution and buffers the backlog.
#   Daytona — the agent sandbox. It is NOT a service here; the engine talks to it over
#             the network via DAYTONA_API_KEY / DAYTONA_API_URL.
#
# Prereqs (see DEPLOYMENT.md §5):
#   1. Compile your project:  loopy compile <project> --out <project>/manifest.json
#   2. Copy .env.example to .env and fill in DAYTONA_API_KEY (+ LOOPY_PROJECT path).
#   3. docker compose up --build
name: loopy

services:
  redis:
    image: redis:7-alpine
    # Append-only persistence so accepted-but-unprocessed events survive a redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  loopy:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    # The collapsed single-node topology: redis bus, sqlite state, daytona sandbox.
    command:
      - run
      - ${LOOPY_MANIFEST:-manifest.json}
      - --root=/project
      - --host=0.0.0.0
      - --port=8000
      - --bus=redis
      - --sandbox=daytona
      - --state=sqlite
      - --state-path=/state/state.db
    environment:
      # Infra creds only — agent secrets ride the sandbox env_file, not the engine env.
      REDIS_URL: redis://redis:6379
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:?set DAYTONA_API_KEY in .env}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
    volumes:
      # The project (manifest + sensors + env files) is read-only at run time.
      - ${LOOPY_PROJECT:-./project}:/project:ro
      # SQLite run history lives on its own volume, scoped to this one writer, so it
      # survives container recreation. This service must stay at a single replica.
      - loopy-state:/state
    ports:
      - "${LOOPY_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  redis-data:
  loopy-state:
