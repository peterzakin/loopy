[project]
name = "loopy-computer"
version = "0.1.0"
description = "Loopy frontend: compile workflows into a validated manifest (the dbt-core of durable agent workflows)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "networkx>=3.2",
    "croniter>=2.0",
    "typer>=0.12",
    "datamodel-code-generator>=0.25",
    "jsonschema>=4.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt[crypto]>=2.8",
    # Daytona is the default sandbox provider (agents run in remote cloud sandboxes,
    # never silently on the host), so its SDK is a core dependency — not an optional extra.
    "daytona>=0.180",
]

[project.scripts]
loopy = "loopy_cli:app"

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopy_core", "loopy_runtime", "loopy_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's CLI idiom: function calls in argument defaults are intentional.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
