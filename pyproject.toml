[project]
name = "loopy-core"
version = "0.1.0"
description = "Loopy: author, compile, and run durable agent workflows (the dbt-core for agents)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Zakin", email = "peter@upfront.com" }]
keywords = ["workflows", "agents", "llm", "durable-execution", "compiler", "manifest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "networkx>=3.2",
    "croniter>=2.0",
    "typer>=0.12",
    "datamodel-code-generator>=0.25",
    "jsonschema>=4.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/peterzakin/loopy"
Repository = "https://github.com/peterzakin/loopy"
Issues = "https://github.com/peterzakin/loopy/issues"

[project.scripts]
loopy = "loopy_cli:app"

[project.optional-dependencies]
daytona = ["daytona>=0.180"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "daytona>=0.180",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopy_core", "loopy_runtime", "loopy_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's CLI idiom: function calls in argument defaults are intentional.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
